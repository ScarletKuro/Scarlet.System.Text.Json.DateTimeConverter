name: continuous

on:
  push:

jobs:
  build-test-pack:
    name: build-test-pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('version.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore src/Scarlet.System.Text.Json.DateTimeConverter.slnx

      - name: Verify whitespace format
        run: dotnet format whitespace src/Scarlet.System.Text.Json.DateTimeConverter.slnx --verify-no-changes

      - name: Verify style format
        run: dotnet format style src/Scarlet.System.Text.Json.DateTimeConverter.slnx --verify-no-changes

      - name: Build
        run: dotnet build src/Scarlet.System.Text.Json.DateTimeConverter.slnx -c Release

      - name: Test with coverage
        run: dotnet test src/Scarlet.System.Text.Json.DateTimeConverter.Tests/Scarlet.System.Text.Json.DateTimeConverter.Tests.csproj -c Release --no-build -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura -p:CoverletOutput=${{ github.workspace }}/artifacts/coverage/Scarlet.System.Text.Json.DateTimeConverter.Tests.xml --logger "junit;LogFilePath=${{ github.workspace }}/artifacts/test-results/Scarlet.System.Text.Json.DateTimeConverter.Tests.xml"

      - name: Pack
        run: dotnet pack src/Scarlet.System.Text.Json.DateTimeConverter/Scarlet.System.Text.Json.DateTimeConverter.csproj -c Release --no-build -o artifacts/packages

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/test-results/*.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: artifacts/coverage/*.xml
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
